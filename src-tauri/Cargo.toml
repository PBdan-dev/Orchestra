[package]
name = "orchestra"
version = "0.1.0"
description = "Orchestra - agent orchestrateur local et transparent"
authors = ["PB"]
edition = "2021"

[lib]
name = "orchestra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
chrono = "0.4"
dirs = "5"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
# validation des schÃ©mas du contrat (motifs Â« pattern Â») ; MIT/Apache-2.0, dÃ©jÃ  prÃ©sent dans les dÃ©pendances
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate-miniz"] }
keyring = { version = "3", features = ["windows-native"] }
sha2 = "0.10"
pdf-extract = "0.9"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
